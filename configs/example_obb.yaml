# Example: oriented bounding boxes (OBB) fine-tuning.
# These are the settings used for the hazelnut / D455 experiments: objects that
# can appear at any angle, on a fixed background, recorded with one camera.
# Run with:
#   python train.py --config configs/example_obb.yaml
#
# To continue from your own checkpoint instead of the COCO weights, point
# `model` at it, e.g. model: runs/my_previous_run/weights/best.pt

model: yolo11n-obb.pt
data: datasets/hazelnut_d455_rgb_52/data.yaml

args:
  epochs: 300
  imgsz: 1280
  batch: 8
  device: 0

  project: runs
  name: hazelnut_obb

  # Optimizer: a hand-tuned SGD schedule beats `auto` when fine-tuning a small
  # dataset, because `auto` picks an LR meant for training from scratch.
  optimizer: SGD
  lr0: 0.005
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cos_lr: true
  box: 10.0          # weight the box loss up: angle/position accuracy matters most here

  # Augmentation tuned for this setup:
  hsv_s: 0.0         # fixed lighting, so do not shift saturation
  mosaic: 0.5
  close_mosaic: 10
  degrees: 60.0      # rotation is the point of OBB — keep this high
  scale: 0.05        # camera distance is fixed, so barely scale
  shear: 0.0
  perspective: 0.0005
